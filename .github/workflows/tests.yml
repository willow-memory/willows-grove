name: Tests

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Single DSN used by grove_db.py, kart_worker, and grove_serve — overrides
      # the WILLOW_PG_DB+WILLOW_PG_USER pair so password is included.
      WILLOW_DB_URL: postgresql://postgres:postgres@localhost/willow_19_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Bootstrap database
        run: |
          psql -c "CREATE DATABASE willow_19_test;"
          psql -d willow_19_test -f schema.sql
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres

      - name: Run test suite
        run: python3 -m pytest -x -q --tb=short
